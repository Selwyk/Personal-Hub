root /usr/share/nginx/html;
index index.html;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
location = /healthz { access_log off; return 200 'ok'; }
location /api/ {
  proxy_pass http://api:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $hub_scheme;
  # Overwrite untrusted forwarding chains. Client IP throttling remains global
  # behind this ingress, plus independent per-user buckets in PostgreSQL.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 30s;
}
location /assets/ { try_files $uri =404; expires 1y; }
location / { try_files $uri /index.html; expires -1; }
