worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # No request URLs, query strings, headers or private payloads in logs.
  log_format minimal '$time_iso8601 $status $request_method';
  access_log /dev/stdout minimal;
  # Runtime error logs may contain private request URIs; use health checks and
  # status-only access logs. nginx -t still reports configuration diagnostics.
  error_log /dev/null crit;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 2m;
  include /etc/nginx/conf.d/*.conf;
}
